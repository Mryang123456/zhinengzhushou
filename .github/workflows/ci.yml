name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s backend/tests
      - run: python -m backend.evals.rag backend/evals/rag_regression.jsonl --mode fixture -k 1 --min-recall 1 --min-no-evidence-accuracy 1
      - run: python -m py_compile backend/app/api/server.py backend/app/agent/service.py
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
