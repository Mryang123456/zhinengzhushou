name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent_test
          POSTGRES_PASSWORD: agent_test
          POSTGRES_DB: agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_test -d agent_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s backend/tests
        env:
          TEST_CHECKPOINT_DATABASE_URL: postgresql://agent_test:agent_test@127.0.0.1:5432/agent_test
      - run: python -m backend.evals.rag backend/evals/rag_regression.jsonl --mode fixture -k 1 --min-recall 1 --min-no-evidence-accuracy 1
      - run: python -m py_compile backend/app/api/server.py backend/app/agent/service.py
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
